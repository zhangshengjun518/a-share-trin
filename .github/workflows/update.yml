name: 更新 TRIN 数据

on:
  workflow_dispatch:          # Actions 页面手动点 Run workflow
  schedule:
    - cron: "7 10 * * 1-5"    # 北京时间工作日 18:07（daily_basic 15–17 点更新完）

permissions:
  contents: write

concurrency:
  group: update-trin
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装中文字体
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-cjk && rm -rf ~/.cache/matplotlib

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 拉取数据
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: jupyter nbconvert --to notebook --execute --inplace --ExecutePreprocessor.timeout=-1 pull_data.ipynb

      - name: 出图并更新 README
        run: jupyter nbconvert --to notebook --execute --inplace --ExecutePreprocessor.timeout=600 charts.ipynb

      - name: 提交结果
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data charts README.md pull_data.ipynb charts.ipynb
          git diff --cached --quiet && echo "没有变化" && exit 0
          git commit -m "数据更新 $(TZ=Asia/Shanghai date +%F)"
          git push
